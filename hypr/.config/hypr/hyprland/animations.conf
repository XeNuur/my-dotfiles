
# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint, 0.16, 1, 0.30, 1
    bezier = winIn, 0.34, 1.2, 0.5, 1
    bezier = winOut, 0.33, 1, 0.68, 1
    bezier = wind, 0.05, 0.9, 0.1, 1.05

    animation = global, 1, 10, default
    animation = border, 1, 4.12, easeOutQuint

    animation = windows, 1, 4.79, wind 
    animation = windowsIn, 1, 3.14, wind, popin 60%
    animation = windowsOut, 1, 3.14, winOut, popin 60% 
    animation = windowsMove, 1, 2.17, wind, slide 

    animation = fade, 1, 3.03, default 
    animation = workspaces, 1, 5.0, wind, slide 
    animation = specialWorkspace, 1, 4.12, wind, slidefadevert
}




###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty 
$menu = pkill wofi; wofi

$resize_amount = 20
$resize_amount_big = 100

$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $menu
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, E, togglesplit, # dwindle

# bind = $mainMod, E, layoutmsg, orientationcycle left right # master 
# bind = $mainMod, n, layoutmsg, cyclenext # master 
# bind = $mainMod, m, layoutmsg, cycleprev # master 
# bind = $mainMod SHIFT, n, layoutmsg, swapnext # master 
# bind = $mainMod SHIFT, m, layoutmsg, swapprev # master 

# Move focus & swap with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Resize focused window 
bind = $mainMod ALT, h, resizeactive,    -$resize_amount   0
bind = $mainMod ALT, l, resizeactive,    $resize_amount    0
bind = $mainMod ALT, k, resizeactive,    0     -$resize_amount
bind = $mainMod ALT, j, resizeactive,    0     $resize_amount

bind = $mainMod ALT SHIFT, h, resizeactive,    -$resize_amount_big   0
bind = $mainMod ALT SHIFT, l, resizeactive,    $resize_amount_big    0
bind = $mainMod ALT SHIFT, k, resizeactive,    0       -$resize_amount_big
bind = $mainMod ALT SHIFT, j, resizeactive,    0       $resize_amount_big 

#focus & move prev, next workspace with mainMod + [i, o] and go to active workspaces using Tab
bind = $mainMod      , i, workspace, -1 
bind = $mainMod      , o, workspace, +1 
bind = $mainMod SHIFT, i, movetoworkspacesilent, -1 
bind = $mainMod SHIFT, o, movetoworkspacesilent, +1 
bind = $mainMod      , Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1

# Example special workspace (scratchpad)
bind = $mainMod         , Escape, togglespecialworkspace , magic
bind = $mainMod SHIFT   , Escape, movetoworkspacesilent  , special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Custom multimedia volume keybinds with lock screen
bindel = $mainMod SHIFT, period,    exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = $mainMod SHIFT, comma,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = $mainMod SHIFT, slash,     exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind   = $mainMod SHIFT, u,         exec, $HOME/.config/hypr/scripts/locknow.sh
bind   =        ,Print, exec, $HOME/.config/hypr/scripts/printscreen.sh
bind   = CONTROL,Print, exec, $HOME/.config/hypr/scripts/screenshot.sh
bind   = $mainMod SHIFT, v, exec, $HOME/.config/hypr/scripts/volsel.sh

# Notification control management
bind = $mainMod      , m,  exec, dunstctl close 
bind = $mainMod SHIFT, m,  exec, dunstctl close-all 
bind = CONTROL ALT, c,  exec, $HOME/.config/hypr/scripts/notifstat/cpu.sh
bind = CONTROL ALT, m,  exec, $HOME/.config/hypr/scripts/notifstat/mem.sh
bind = CONTROL ALT, p,  exec, $HOME/.config/hypr/scripts/notifstat/mpris.sh
bind = CONTROL ALT, n,  exec, $HOME/.config/hypr/scripts/notifstat/net.sh
bind = CONTROL ALT, t,  exec, $HOME/.config/hypr/scripts/notifstat/time.sh
bind = CONTROL ALT, a,  exec, $HOME/.config/hypr/scripts/notifstat/audio.sh
bind = CONTROL ALT, b,  exec, $HOME/.config/hypr/scripts/notifstat/bt.sh

# Hide the waybar
bind = $mainMod SHIFT, z, exec, killall -SIGUSR1 waybar
bind = $mainMod SHIFT, x, setprop, active opaque toggle


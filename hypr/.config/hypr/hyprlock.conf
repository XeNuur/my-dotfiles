label { # Date 
    monitor = 
    text = cmd[update:10000] echo $(date +"%d.%m, %A")
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 16
    font_family = $font_family

    position = -50, 150 
    halign = right 
    valign = bottom 
}

input-field {
    monitor =
    size = 310, 60
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.35
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    hide_input = false
    placeholder_text = 

    position = 50, 50
    halign = left 
    valign = bottom 
}


label { # Clock
    monitor = 
    text = cmd[update:1000] $HOME/.config/hypr/scripts/clockprint.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 65
    font_family = $font_family_clock

    position = -50, 50 
    halign = right 
    valign = bottom 
}

